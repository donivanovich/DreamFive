name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.22.3'
  CI: true

jobs:
  quality:
    name: Calidad, compilación y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: dream5
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: dream5_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dream5 -d dream5_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:8.8.4-alpine3.23
        command: redis-server --requirepass ci-redis-password-1234 --maxmemory-policy noeviction
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -a ci-redis-password-1234 ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://dream5:ci-postgres-password@127.0.0.1:5432/dream5_ci?schema=public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ci-redis-password-1234
      API_CORS_ORIGINS: http://localhost:3000
      WEB_PUBLIC_URL: http://localhost:3000
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Instalar pnpm
        uses: pnpm/action-setup@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Validar esquema Prisma
        run: pnpm run db:validate

      - name: Generar cliente Prisma y compilar paquetes internos
        run: pnpm run build:packages

      - name: Comprobar formato (Prettier)
        run: pnpm run format:check

      - name: Comprobar linter (ESLint)
        run: pnpm run lint

      - name: Comprobar tipos (TypeScript estricto)
        run: pnpm run typecheck

      - name: Compilar aplicaciones y paquetes
        run: pnpm run build

      - name: Aplicar migraciones Prisma de prueba
        run: pnpm run db:migrate:deploy

      - name: Ejecutar pruebas unitarias y de integración (Vitest)
        run: pnpm run test

  e2e:
    name: Pruebas E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: dream5
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: dream5_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dream5 -d dream5_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:8.8.4-alpine3.23
        command: redis-server --requirepass ci-redis-password-1234 --maxmemory-policy noeviction
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -a ci-redis-password-1234 ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: development
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://dream5:ci-postgres-password@127.0.0.1:5432/dream5_e2e?schema=public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ci-redis-password-1234
      API_PORT: '3001'
      API_CORS_ORIGINS: http://localhost:3000
      WEB_PUBLIC_URL: http://localhost:3000
      DEV_TOOLS_ENABLED: 'true'
      VITE_API_URL: http://localhost:3001
      VITE_DEV_TOOLS_ENABLED: 'false'
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Instalar pnpm
        uses: pnpm/action-setup@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Compilar paquetes y aplicaciones
        run: pnpm run build

      - name: Preparar base de datos E2E y datos semilla
        run: |
          pnpm run db:migrate:deploy
          pnpm --filter @dream5/database run db:seed

      - name: Arrancar API en segundo plano para E2E
        run: |
          nohup pnpm --filter @dream5/api run start > api-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health/ready; then
              echo ""
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondió a /health/ready"
          cat api-e2e.log || true
          exit 1

      - name: Instalar navegador Chromium para Playwright
        run: pnpm --filter @dream5/web exec playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: pnpm run test:e2e

      - name: Subir informe de Playwright y logs en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            api-e2e.log
          retention-days: 7

  docker-and-audit:
    name: Validación Docker y auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Instalar pnpm
        uses: pnpm/action-setup@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Auditar dependencias de producción
        run: pnpm audit --prod --audit-level=high

      - name: Validar sintaxis de Docker Compose
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-placeholder-password
          POSTGRES_DB: dream5_ci
          REDIS_PASSWORD: ci-placeholder-redis-password
          API_CORS_ORIGINS: http://localhost:3000
        run: docker compose config --quiet
