name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true

jobs:
  static-and-unit:
    name: Calidad estática, build y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar entorno Node.js y pnpm
        uses: ./.github/actions/setup-workspace

      - name: Validar esquema Prisma
        run: pnpm run db:validate

      - name: Generar cliente Prisma y compilar paquetes internos
        run: pnpm run build:packages

      - name: Comprobar formato (Prettier)
        run: pnpm run format:check

      - name: Comprobar linter (ESLint estricto)
        run: pnpm exec eslint . --max-warnings=0

      - name: Comprobar tipos (TypeScript estricto)
        run: pnpm -r --sort run typecheck

      - name: Compilar monorepo completo (producción)
        run: pnpm run build

      - name: Ejecutar pruebas unitarias (shared, simulation-engine, web, worker y scripts)
        run: |
          pnpm --filter @dreamfive/shared run test
          pnpm --filter @dreamfive/simulation-engine run test
          pnpm --filter @dreamfive/web run test
          pnpm --filter @dreamfive/worker run test
          node --test infrastructure/scripts/*.test.mjs

  integration:
    name: Pruebas de integración (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: dreamfive
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: dreamfive_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dreamfive -d dreamfive_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:8.8.4-alpine3.23
        command: redis-server --requirepass ci-redis-password-1234 --maxmemory-policy noeviction
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -a ci-redis-password-1234 ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://dreamfive:ci-postgres-password@127.0.0.1:5432/dreamfive_ci?schema=public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ci-redis-password-1234
      API_CORS_ORIGINS: http://localhost:3000
      WEB_PUBLIC_URL: http://localhost:3000
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar entorno Node.js y pnpm
        uses: ./.github/actions/setup-workspace

      - name: Compilar paquetes internos y cliente Prisma
        run: pnpm run build:packages

      - name: Aplicar migraciones Prisma de prueba
        run: pnpm run db:migrate:deploy

      - name: Ejecutar pruebas de integración de dominio (@dreamfive/database)
        run: pnpm --filter @dreamfive/database run test

      - name: Ejecutar pruebas de integración HTTP/API (@dreamfive/api)
        run: pnpm --filter @dreamfive/api run test

  docker-and-security:
    name: Validación Docker y auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar entorno Node.js y pnpm
        uses: ./.github/actions/setup-workspace

      - name: Auditar dependencias de producción (severidad alta/crítica)
        run: pnpm audit --prod --audit-level=high

      - name: Validar sintaxis de Docker Compose (base, desarrollo y producción)
        env:
          GHCR_IMAGE_PREFIX: ghcr.io/ci/dreamfive
          IMAGE_TAG: sha-0000000
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-placeholder-password
          POSTGRES_DB: dreamfive_ci
          REDIS_PASSWORD: ci-placeholder-redis-password
          API_CORS_ORIGINS: http://localhost:3000
          WEB_PUBLIC_URL: http://localhost:3000
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Validar sintaxis del gateway Nginx
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.28.3-alpine nginx -t

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validar build Docker (target api)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/node.Dockerfile
          target: api
          push: false
          cache-from: type=gha,scope=dreamfive-docker
          cache-to: type=gha,scope=dreamfive-docker,mode=max

      - name: Validar build Docker (target worker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/node.Dockerfile
          target: worker
          push: false
          cache-from: type=gha,scope=dreamfive-docker

      - name: Validar build Docker (target web)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/node.Dockerfile
          target: web
          push: false
          cache-from: type=gha,scope=dreamfive-docker

      - name: Validar build Docker (target migrate)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/node.Dockerfile
          target: migrate
          push: false
          cache-from: type=gha,scope=dreamfive-docker

      - name: Validar build Docker (target seed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/node.Dockerfile
          target: seed
          push: false
          cache-from: type=gha,scope=dreamfive-docker

  e2e:
    name: Pruebas E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [static-and-unit, integration]
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: dreamfive
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: dreamfive_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dreamfive -d dreamfive_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:8.8.4-alpine3.23
        command: redis-server --requirepass ci-redis-password-1234 --maxmemory-policy noeviction
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -a ci-redis-password-1234 ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: development
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://dreamfive:ci-postgres-password@127.0.0.1:5432/dreamfive_e2e?schema=public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ci-redis-password-1234
      API_PORT: '3001'
      API_CORS_ORIGINS: http://localhost:3000
      WEB_PUBLIC_URL: http://localhost:3000
      DEV_TOOLS_ENABLED: 'true'
      VITE_API_URL: http://localhost:3001
      VITE_DEV_TOOLS_ENABLED: 'false'
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar entorno Node.js y pnpm
        uses: ./.github/actions/setup-workspace

      - name: Compilar paquetes y API para E2E
        run: |
          pnpm run build:packages
          pnpm run build:api

      - name: Preparar base de datos E2E y datos semilla
        run: |
          pnpm run db:migrate:deploy
          pnpm --filter @dreamfive/database run db:seed

      - name: Arrancar API en segundo plano para E2E
        run: |
          nohup pnpm --filter @dreamfive/api run start > api-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health/ready; then
              echo ""
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondió a /health/ready"
          cat api-e2e.log || true
          exit 1

      - name: Restaurar caché de navegadores Playwright
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json', 'pnpm-lock.yaml') }}

      - name: Instalar navegador Chromium y dependencias de sistema (sin caché)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @dreamfive/web exec playwright install --with-deps chromium

      - name: Instalar dependencias de sistema para Chromium (con caché)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @dreamfive/web exec playwright install-deps chromium

      - name: Ejecutar pruebas E2E
        run: pnpm run test:e2e

      - name: Subir informe de Playwright y logs en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            api-e2e.log
          retention-days: 7
