name: Security & Maintenance

on:
  schedule:
    # Todos los lunes a las 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  audit:
    name: Auditoría programada de dependencias y configuración
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Preparar entorno Node.js y pnpm
        uses: ./.github/actions/setup-workspace

      - name: Auditar dependencias de producción (severidad alta/crítica)
        run: pnpm audit --prod --audit-level=high

      - name: Resumen informativo de auditoría completa del workspace
        continue-on-error: true
        run: pnpm audit

      - name: Validar esquema Prisma
        run: pnpm run db:validate

      - name: Validar sintaxis de Docker Compose
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-placeholder-password
          POSTGRES_DB: dreamfive_ci
          REDIS_PASSWORD: ci-placeholder-redis-password
          API_CORS_ORIGINS: http://localhost:3000
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
