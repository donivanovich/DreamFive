# -----------------------------------------------------------------------------
# DreamFive — Docker Compose de PRODUCCIÓN (Raspberry Pi 5 / linux/arm64)
# -----------------------------------------------------------------------------
# Ruta de producción: /opt/docker/apps/DreamFive
# Exposición pública: Cloudflare Tunnel (dreamfive.donivanovich.dev -> localhost:3000)
#
# Exposición de puertos:
#   * gateway (Nginx): ÚNICO servicio con puerto publicado en el host
#     (`127.0.0.1:3000 -> 80`).
#   * web, api, worker, postgres, redis, migrate, seed: únicamente comunicación
#     interna Docker (sin puertos publicados en el host).
#
# Variables clave en `.env` de producción:
#   GHCR_IMAGE_PREFIX=ghcr.io/donivanovich/dreamfive
#   IMAGE_TAG=main                      # Sobrescrito con `sha-xxxxxxx` en CD
#   GATEWAY_PORT=3000
#   WEB_PUBLIC_URL=https://dreamfive.donivanovich.dev
#   API_CORS_ORIGINS=https://dreamfive.donivanovich.dev
#
# Arranque inicial (el `seed` solo se ejecuta manualmente bajo autorización):
#   docker compose -f docker-compose.prod.yml up -d postgres redis
#   docker compose -f docker-compose.prod.yml --profile ops run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d api worker web gateway
# -----------------------------------------------------------------------------

name: dreamfive

x-app-hardening: &app-hardening
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: false
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  gateway:
    image: nginx:1.28.3-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
      - /tmp:size=8m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-3000}:80'
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/gateway-health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    shm_size: 128m

  redis:
    image: redis:8.8.4-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$${REDIS_PASSWORD}"
        --appendonly yes
        --maxmemory-policy noeviction
        --protected-mode yes
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  api:
    <<: *app-hardening
    image: ${GHCR_IMAGE_PREFIX:?Define GHCR_IMAGE_PREFIX en .env}-api:${IMAGE_TAG:-latest}
    environment:
      TZ: ${TZ:-Europe/Madrid}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: 3001
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:?Define API_CORS_ORIGINS en .env}
      API_TRUST_PROXY: ${API_TRUST_PROXY:-true}
      API_SWAGGER_ENABLED: 'false'
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-168}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-dreamfive_session}
      DEV_TOOLS_ENABLED: 'false'
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-dreamfive}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?Define WEB_PUBLIC_URL en .env}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-DreamFive <no-reply@dreamfive.local>}
      UPLOAD_DIR: /app/uploads
    volumes:
      - api-uploads:/app/uploads
    networks:
      - backend
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app-hardening
    image: ${GHCR_IMAGE_PREFIX:?Define GHCR_IMAGE_PREFIX en .env}-worker:${IMAGE_TAG:-latest}
    environment:
      TZ: ${TZ:-Europe/Madrid}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-dreamfive}
      WORKER_HEARTBEAT_FILE: /tmp/worker.heartbeat
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-10000}
      WORKER_SCHEDULER_INTERVAL_MS: ${WORKER_SCHEDULER_INTERVAL_MS:-5000}
    networks:
      - backend
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *app-hardening
    image: ${GHCR_IMAGE_PREFIX:?Define GHCR_IMAGE_PREFIX en .env}-web:${IMAGE_TAG:-latest}
    environment:
      TZ: ${TZ:-Europe/Madrid}
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?Define WEB_PUBLIC_URL en .env}
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy

  migrate:
    image: ${GHCR_IMAGE_PREFIX:?Define GHCR_IMAGE_PREFIX en .env}-migrate:${IMAGE_TAG:-latest}
    restart: 'no'
    profiles:
      - ops
    environment:
      TZ: ${TZ:-Europe/Madrid}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  seed:
    image: ${GHCR_IMAGE_PREFIX:?Define GHCR_IMAGE_PREFIX en .env}-seed:${IMAGE_TAG:-latest}
    restart: 'no'
    profiles:
      - seed
    environment:
      TZ: ${TZ:-Europe/Madrid}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    internal: true
  edge: {}

volumes:
  postgres-data:
  redis-data:
  api-uploads:
