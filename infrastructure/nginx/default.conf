# -----------------------------------------------------------------------------
# DreamFive — Gateway Nginx (punto de entrada único)
# -----------------------------------------------------------------------------
# Único servicio con puerto publicado en el host (127.0.0.1:3000 -> 80).
# Cloudflare Tunnel reenvía https://dreamfive.donivanovich.dev -> localhost:3000.
#
# Enrutamiento interno (red Docker `edge`):
#   - /gateway-health  -> liveness del propio gateway (200 ok)
#   - /socket.io/      -> http://api:3001/socket.io/ (WebSocket + polling)
#   - /api/socket.io/  -> http://api:3001/socket.io/ (compatibilidad prefijada)
#   - /api/            -> http://api:3001/           (API REST Fastify)
#   - /uploads/        -> http://api:3001/uploads/   (avatares servidos por API)
#   - /                -> http://web:3000            (Frontend TanStack Start SSR)
# -----------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 80;
  server_name _;

  server_tokens off;
  # Coincide con el límite de 5 MiB de @fastify/multipart más cabecera multipart.
  client_max_body_size 6m;

  # Docker embedded DNS para re-resolver upstreams tras reinicios de contenedores.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Liveness ligero para el HEALTHCHECK de Docker.
  location = /gateway-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # WebSockets y long-polling de Socket.IO (raíz y variante prefijada /api/socket.io/).
  location /socket.io/ {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/socket.io/ {
    set $api_upstream http://api:3001;
    rewrite ^/api(/socket\.io/.*)$ $1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # API REST (/api/<ruta> -> http://api:3001/<ruta>).
  location /api/ {
    set $api_upstream http://api:3001;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Recursos binarios servidos por la API (avatares de usuario).
  location /uploads/ {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_read_timeout 30s;
  }

  # Aplicación web SSR (TanStack Start) y activos estáticos.
  location / {
    set $web_upstream http://web:3000;
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
